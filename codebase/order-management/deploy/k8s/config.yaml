# Non-secret configuration lives in a ConfigMap; credentials in a Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
data:
  HTTP_ADDR: ":8082"
  USER_SERVICE_URL: "http://user-service:8081"
  USER_SERVICE_TIMEOUT: "800ms"
  USER_SERVICE_MAX_ATTEMPTS: "3"
  OUTBOX_RELAY_INTERVAL: "500ms"
  EVENTS_EXCHANGE: "orders"
  LOG_LEVEL: "info"
---
# Secrets are only base64-encoded, not encrypted. Enable encryption at rest
# for etcd, restrict access with RBAC, and prefer an external secret store
# (Vault, AWS Secrets Manager via External Secrets Operator) in production.
# This manifest is an example only — never commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secrets
type: Opaque
stringData:
  database-url: "postgres://orders:CHANGE_ME@orders-db:5432/orders?sslmode=require"
  rabbitmq-url: "amqp://oms:CHANGE_ME@rabbitmq:5672/"
