<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Microverse Academy</title>
  <meta name="description" content="Microverse — an interactive engineering academy for designing, building, debugging, deploying and scaling production-grade microservices with Go.">
  <meta name="theme-color" content="#080B12">
  <link rel="icon" href="assets/icons/logo.svg" type="image/svg+xml">

  <!-- Apply the saved theme before first paint to avoid a flash -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('microverse:state:v1') || '{}');
      if (s.theme) document.documentElement.setAttribute('data-theme', s.theme);
      if (s.sidebarCollapsed) document.documentElement.classList.add('pre-collapsed');
    } catch (e) {}
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/widgets.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/animations.css">

  <!-- Tailwind CSS v4 (browser build): utilities for layout and spacing.
       Component styles live in css/*.css inside @layer components, so
       utilities always win when both apply. -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-bg: var(--bg);
      --color-bg2: var(--bg-2);
      --color-surface: var(--surface);
      --color-elevated: var(--elevated);
      --color-line: var(--line);
      --color-fg: var(--fg);
      --color-fg2: var(--fg-2);
      --color-muted: var(--muted);
      --color-accent: var(--blue);
      --color-cyan: var(--cyan);
      --color-purple: var(--purple);
      --color-green: var(--green);
      --color-warn: var(--warn);
      --color-err: var(--err);
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
    <div class="sidebar-scrim" aria-hidden="true"></div>
    <header class="topbar" id="topbar"></header>
    <main class="main" id="main" tabindex="-1">
      <div class="view" id="view">
        <div class="page"><div class="grid gap-3" aria-busy="true" aria-label="Loading">
          <div class="skeleton sk-title"></div><div class="skeleton sk-line" style="width:80%"></div><div class="skeleton sk-line" style="width:65%"></div>
        </div></div>
      </div>
    </main>
  </div>

  <div id="overlay-root"></div>
  <div id="toaster" class="toaster" aria-live="polite"></div>
  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

  <noscript>
    <div style="padding:24px;font-family:system-ui;color:#E6EAF2;background:#080B12">Microverse is an interactive application and needs JavaScript enabled.</div>
  </noscript>

  <!-- Libraries (pinned versions) -->
  <script defer src="https://cdn.jsdelivr.net/npm/motion@14.9.0/dist/motion.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/ScrollTrigger.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/lenis@1.3.27/dist/lenis.min.js"></script>

  <!-- Lucide icon data (subset generated by tools/build-icons.mjs) -->
  <script defer src="assets/icons/icons.js"></script>

  <!-- Core -->
  <script defer src="js/state.js"></script>
  <script defer src="js/highlight.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/markdown.js"></script>
  <script defer src="js/quiz.js"></script>

  <!-- Course data -->
  <script defer src="data/lessons.js"></script>
  <script defer src="data/architectures.js"></script>
  <script defer src="data/challenges.js"></script>
  <script defer src="data/bootcamp.js"></script>
  <script defer src="data/codebase.js"></script>
  <script defer src="data/assessment.js"></script>

  <!-- Features -->
  <script defer src="js/navigation.js"></script>
  <script defer src="js/architecture.js"></script>
  <script defer src="js/simulator.js"></script>
  <script defer src="js/widgets/kit.js"></script>
  <script defer src="js/widgets/foundations.js"></script>
  <script defer src="js/widgets/go.js"></script>
  <script defer src="js/widgets/gateway.js"></script>
  <script defer src="js/widgets/communication.js"></script>
  <script defer src="js/widgets/database.js"></script>
  <script defer src="js/widgets/patterns.js"></script>
  <script defer src="js/widgets/deploy.js"></script>
  <script defer src="js/widgets/observability.js"></script>
  <script defer src="js/lessons.js"></script>
  <script defer src="js/playground.js"></script>
  <script defer src="js/challenges.js"></script>
  <script defer src="js/bootcamp.js"></script>
  <script defer src="js/progress.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
